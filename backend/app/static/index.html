<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShramikMitra AI - Labour Rights Assistant</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: '#2563EB',
              hover: '#1D4ED8',
            },
            secondary: {
              DEFAULT: '#16A34A',
              hover: '#15803D',
            },
            accent: {
              DEFAULT: '#F59E0B',
            }
          }
        }
      }
    }
  </script>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* Flashing SOS helper */
    @keyframes pulse-slow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.02); }
    }
    .animate-pulse-slow {
      animation: pulse-slow 2.5s infinite;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-200">
  <div id="app" class="min-h-screen flex flex-col">
    <!-- Screen View Renderers will be managed dynamically via JavaScript state -->
  </div>

  <!-- JavaScript State Machine & API Service -->
  <script>
    const API_BASE = ""; // Relative to server root

    // Central state object
    const state = {
      token: localStorage.getItem("shramik_token") || null,
      user: null,
      activeView: "landing", // landing, login, register, dashboard, chat, rights, schemes, complaints, documents, map, diary, profile
      language: "en", // en or hi
      theme: localStorage.getItem("shramik_theme") || "light",
      
      // Feature Data Store
      chatHistory: [],
      chatInput: "",
      chatLoading: false,
      
      rights: [],
      rightsSearch: "",
      rightsCategory: "All",
      selectedRight: null,
      
      schemesMatched: null,
      schemesLoading: false,
      schemeForm: { age: 25, gender: "Male", occupation: "Construction", state: "Delhi" },
      
      complaintForm: { employer_name: "", issue: "Unpaid Wages", date: "", description: "" },
      complaintGenerated: null,
      complaintLoading: false,
      complaintHistory: [],
      complaintTab: "en",
      
      diaryEntries: [],
      diaryLoading: false,
      diaryForm: { id: null, date: "", employer: "", hours_worked: 8, salary_earned: 673, notes: "" },
      diaryModalOpen: false,
      
      docAnalysis: null,
      docLoading: false,
      docFile: null,

      // SOS Modal
      sosOpen: false
    };

    // Initialize Theme
    function applyTheme() {
      if (state.theme === "dark") {
        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.remove("dark");
      }
    }
    applyTheme();

    // Custom Headers Helper
    function getHeaders(multipart = false) {
      const headers = {};
      if (!multipart) {
        headers["Content-Type"] = "application/json";
      }
      if (state.token) {
        headers["Authorization"] = `Bearer ${state.token}`;
      }
      return headers;
    }

    // Direct HTTP Request wrapper
    async function request(endpoint, options = {}) {
      try {
        const response = await fetch(`${API_BASE}${endpoint}`, {
          ...options,
          headers: {
            ...getHeaders(options.body instanceof FormData),
            ...(options.headers || {})
          }
        });
        
        if (response.status === 401) {
          logout();
          throw new Error("Session expired. Please sign in again.");
        }
        
        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.detail || "Request failed");
        }
        
        if (response.status === 204) return {};
        return await response.json();
      } catch (e) {
        console.error("API error:", e);
        throw e;
      }
    }

    // Refresh User Profile
    async function refreshUser() {
      if (!state.token) {
        state.user = null;
        return;
      }
      try {
        state.user = await request("/api/auth/me");
        state.language = state.user.preferred_language || "en";
      } catch (e) {
        state.token = null;
        state.user = null;
        localStorage.removeItem("shramik_token");
      }
    }

    // Routing Navigation
    async function navigate(view) {
      state.activeView = view;
      
      // Auto loading dependencies based on view target
      if (view === "dashboard") {
        loadOverviewStats();
      } else if (view === "chat") {
        loadChatHistory();
      } else if (view === "rights") {
        loadRightsLibrary();
      } else if (view === "complaints") {
        loadComplaintHistory();
      } else if (view === "diary") {
        loadDiaryEntries();
      }
      
      render();
    }

    // Actions
    async function handleLogin(username, password) {
      try {
        const tokenRes = await request("/api/auth/login-json", {
          method: "POST",
          body: JSON.stringify({ username, password })
        });
        state.token = tokenRes.access_token;
        localStorage.setItem("shramik_token", tokenRes.access_token);
        await refreshUser();
        navigate("dashboard");
      } catch (e) {
        alert("Error: " + e.message);
      }
    }

    async function handleRegister(username, password) {
      try {
        await request("/api/auth/register", {
          method: "POST",
          body: JSON.stringify({ username, password })
        });
        await handleLogin(username, password);
      } catch (e) {
        alert("Registration failed: " + e.message);
      }
    }

    async function handleGuestLogin() {
      try {
        const tokenRes = await request("/api/auth/guest", { method: "POST" });
        state.token = tokenRes.access_token;
        localStorage.setItem("shramik_token", tokenRes.access_token);
        await refreshUser();
        navigate("dashboard");
      } catch (e) {
        alert("Guest entry failed: " + e.message);
      }
    }

    function logout() {
      state.token = null;
      state.user = null;
      localStorage.removeItem("shramik_token");
      navigate("landing");
    }

    async function toggleLanguage() {
      const nextLang = state.language === "en" ? "hi" : "en";
      state.language = nextLang;
      if (state.user) {
        try {
          state.user = await request("/api/profile/", {
            method: "PUT",
            body: JSON.stringify({ preferred_language: nextLang })
          });
        } catch(e){}
      }
      render();
    }

    function toggleThemeMode() {
      const nextTheme = state.theme === "light" ? "dark" : "light";
      state.theme = nextTheme;
      localStorage.setItem("shramik_theme", nextTheme);
      applyTheme();
      render();
    }

    // --- FEATURE LOADERS & API CALLS ---
    
    // Overview Data
    let totalWagesLogged = 0;
    let totalHoursLogged = 0;
    let recentComplaints = [];
    let recentLogs = [];

    async function loadOverviewStats() {
      try {
        const [diary, complaints] = await Promise.all([
          request("/api/diary/"),
          request("/api/complaints/history")
        ]);
        
        totalHoursLogged = diary.reduce((sum, item) => sum + item.hours_worked, 0);
        totalWagesLogged = diary.reduce((sum, item) => sum + item.salary_earned, 0);
        
        recentLogs = diary.slice(0, 3);
        recentComplaints = complaints.slice(0, 2);
      } catch (e) {
        console.error("Stats load failed", e);
      }
    }

    // AI Chat
    async function loadChatHistory() {
      try {
        state.chatHistory = await request("/api/chat/");
      } catch(e){}
    }

    async function sendChatMessage() {
      const msgText = state.chatInput.trim();
      if (!msgText || state.chatLoading) return;
      
      state.chatInput = "";
      state.chatLoading = true;
      
      // Add user placeholder optimistically
      state.chatHistory.push({
        id: Date.now(),
        message: msgText,
        response: "",
        timestamp: new Date().toISOString()
      });
      render();

      try {
        const chatRes = await request("/api/chat/", {
          method: "POST",
          body: JSON.stringify({ message: msgText })
        });
        state.chatHistory[state.chatHistory.length - 1] = chatRes;
      } catch (e) {
        state.chatHistory.pop();
        alert("Error sending message: " + e.message);
      } finally {
        state.chatLoading = false;
        render();
        scrollToChatBottom();
      }
    }

    function scrollToChatBottom() {
      const el = document.getElementById("chat-pane");
      if (el) el.scrollTop = el.scrollHeight;
    }

    async function clearChatHistory() {
      if (!confirm("Are you sure you want to clear your chat history?")) return;
      try {
        await request("/api/chat/clear", { method: "DELETE" });
        state.chatHistory = [];
        render();
      } catch(e){}
    }

    // Rights Library
    async function loadRightsLibrary() {
      try {
        state.rights = await request("/api/rights/");
      } catch(e){}
    }

    // Schemes Matcher
    async function matchSchemes() {
      state.schemesLoading = true;
      render();
      try {
        state.schemesMatched = await request("/api/schemes/recommend", {
          method: "POST",
          body: JSON.stringify(state.schemeForm)
        });
      } catch (e) {
        alert("Error finding schemes: " + e.message);
      } finally {
        state.schemesLoading = false;
        render();
      }
    }

    // Complaints Generator
    async function loadComplaintHistory() {
      try {
        state.complaintHistory = await request("/api/complaints/history");
      } catch(e){}
    }

    async function generateComplaintLetter() {
      if (!state.complaintForm.employer_name || !state.complaintForm.date || !state.complaintForm.description) {
        alert("Please fill in all fields.");
        return;
      }
      state.complaintLoading = true;
      render();
      try {
        state.complaintGenerated = await request("/api/complaints/generate", {
          method: "POST",
          body: JSON.stringify(state.complaintForm)
        });
        await loadComplaintHistory();
      } catch (e) {
        alert("Complaint failed to generate: " + e.message);
      } finally {
        state.complaintLoading = false;
        render();
      }
    }

    function triggerPdfDownload(id) {
      window.open(`/api/complaints/${id}/download?token=${state.token}`, "_blank");
    }

    // Worker Diary CRUD
    async function loadDiaryEntries() {
      try {
        state.diaryEntries = await request("/api/diary/");
        totalHoursLogged = state.diaryEntries.reduce((sum, item) => sum + item.hours_worked, 0);
        totalWagesLogged = state.diaryEntries.reduce((sum, item) => sum + item.salary_earned, 0);
      } catch(e){}
    }

    async function saveDiaryEntry() {
      if (!state.diaryForm.date || !state.diaryForm.employer) {
        alert("Please enter a date and employer.");
        return;
      }
      state.diaryLoading = true;
      
      const payload = {
        date: state.diaryForm.date,
        employer: state.diaryForm.employer,
        hours_worked: Number(state.diaryForm.hours_worked),
        salary_earned: Number(state.diaryForm.salary_earned),
        notes: state.diaryForm.notes || undefined
      };

      try {
        if (state.diaryForm.id) {
          // Edit
          const updated = await request(`/api/diary/${state.diaryForm.id}`, {
            method: "PUT",
            body: JSON.stringify(payload)
          });
          state.diaryEntries = state.diaryEntries.map(e => e.id === state.diaryForm.id ? updated : e);
        } else {
          // Create
          const created = await request("/api/diary/", {
            method: "POST",
            body: JSON.stringify(payload)
          });
          state.diaryEntries.unshift(created);
        }
        state.diaryModalOpen = false;
        await loadDiaryEntries();
        render();
      } catch (e) {
        alert("Failed to save entry: " + e.message);
      } finally {
        state.diaryLoading = false;
      }
    }

    async function deleteDiaryEntry(id) {
      if (!confirm("Are you sure you want to delete this log?")) return;
      try {
        await request(`/api/diary/${id}`, { method: "DELETE" });
        state.diaryEntries = state.diaryEntries.filter(e => e.id !== id);
        await loadDiaryEntries();
        render();
      } catch (e) {
        alert("Delete failed");
      }
    }

    function openDiaryModal(entry = null) {
      if (entry) {
        state.diaryForm = { ...entry };
      } else {
        state.diaryForm = { id: null, date: new Date().toISOString().split("T")[0], employer: "", hours_worked: 8, salary_earned: 673, notes: "" };
      }
      state.diaryModalOpen = true;
      render();
    }

    // Document Analyzer
    async function uploadDocument() {
      const input = document.getElementById("payslip-file");
      if (!input || !input.files[0]) {
        alert("Please select a file to analyze.");
        return;
      }
      
      state.docLoading = true;
      render();

      const formData = new FormData();
      formData.append("file", input.files[0]);

      try {
        state.docAnalysis = await request("/api/upload/", {
          method: "POST",
          body: formData
        });
      } catch (e) {
        alert("Analysis failed: " + e.message);
      } finally {
        state.docLoading = false;
        render();
      }
    }

    // Web Speech API browser integration
    let speechRecognition = null;
    let isSpeechListening = false;

    function initSpeech() {
      if (typeof window !== "undefined") {
        const SpeechRecObj = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecObj) {
          speechRecognition = new SpeechRecObj();
          speechRecognition.continuous = false;
          speechRecognition.interimResults = false;
          
          speechRecognition.onstart = () => {
            isSpeechListening = true;
            render();
          };
          speechRecognition.onresult = (e) => {
            const transcript = e.results[0][0].transcript;
            const inputEl = document.getElementById("chat-input-box");
            if (inputEl) {
              state.chatInput = inputEl.value + (inputEl.value ? " " : "") + transcript;
            } else {
              state.chatInput = transcript;
            }
            render();
          };
          speechRecognition.onerror = (e) => {
            console.error("Speech error", e);
            isSpeechListening = false;
            render();
          };
          speechRecognition.onend = () => {
            isSpeechListening = false;
            render();
          };
        }
      }
    }
    initSpeech();

    function toggleSpeechDictation() {
      if (!speechRecognition) {
        alert("Web Speech dictation is not supported by your current browser. Try Chrome, Safari, or Edge.");
        return;
      }
      
      if (isSpeechListening) {
        speechRecognition.stop();
      } else {
        speechRecognition.lang = state.language === "hi" ? "hi-IN" : "en-IN";
        try {
          speechRecognition.start();
        } catch(e){}
      }
    }

    // --- HTML RENDER ENGINE ---

    // Translations Object
    const t = {
      en: {
        logo: "ShramikMitra AI",
        tagline: "Know Your Rights. Protect Your Future.",
        subtagline: "Delhi NCR's dedicated labour assistant. Calculate wages, verify contracts, generate complaints, and match welfare schemes.",
        getStarted: "Get Started",
        tryAi: "Try AI Assistant",
        features: "Features",
        faq: "FAQs",
        how: "How it Works",
        signIn: "Sign In",
        register: "Register",
        guestMode: "Guest Mode",
        logout: "Log Out",
        welcome: "Welcome",
        overview: "Overview",
        aiChat: "AI Chat Assistant",
        rightsLib: "Labour Rights Library",
        complaintGen: "Complaint Maker",
        schemesMatch: "Welfare Schemes",
        docAnal: "Document Analyzer",
        helpMap: "Nearby Help Map",
        diary: "Worker Diary",
        profile: "Profile Settings",
        sos: "Emergency SOS",
        recent: "Recent Activity",
        hours: "Logged Hours",
        wages: "Logged Earnings",
        compCount: "Complaints Generated",
        advisory: "Delhi Labour Advisory",
        adv1: "1. Overtime: Legally, working beyond 8 hours a day requires double pay (2x). Keep record.",
        adv2: "2. Weekly Off: You are entitled to 1 paid day off per week.",
        adv3: "3. Direct Bank Pay: Avoid cash where possible to ensure verifiable transaction proofs."
      },
      hi: {
        logo: "श्रमिकमित्र एआई",
        tagline: "अपने अधिकारों को जानें। अपना भविष्य बचाएं।",
        subtagline: "दिल्ली एनसीआर का समर्पित श्रम सहायता पोर्टल। वेतन की गणना करें, विसंगतियों की जांच करें, शिकायतें उत्पन्न करें और योजनाओं का लाभ उठाएं।",
        getStarted: "शुरू करें",
        tryAi: "एआई सहायक",
        features: "विशेषताएं",
        faq: "पूछे जाने वाले प्रश्न",
        how: "काम कैसे करता है",
        signIn: "लॉग इन करें",
        register: "पंजीकरण",
        guestMode: "अतिथि मोड",
        logout: "लॉग आउट",
        welcome: "स्वागत हे",
        overview: "अवलोकन",
        aiChat: "एआई चैट सहायक",
        rightsLib: "अधिकार पुस्तकालय",
        complaintGen: "शिकायत निर्माता",
        schemesMatch: "कल्याणकारी योजनाएं",
        docAnal: "दस्तावेज़ विश्लेषक",
        helpMap: "सहायता नक्शा",
        diary: "कामगार डायरी",
        profile: "प्रोफ़ाइल सेटिंग",
        sos: "आपातकालीन एसओएस",
        recent: "हाल की गतिविधि",
        hours: "काम के घंटे",
        wages: "कुल वेतन",
        compCount: "उत्पन्न शिकायतें",
        advisory: "दैनिक श्रम नियम",
        adv1: "1. ओवरटाइम: कानूनन, 8 घंटे से अधिक काम करने पर दोगुना वेतन (2x) मिलना चाहिए।",
        adv2: "2. साप्ताहिक छुट्टी: सप्ताह में 1 दिन सवैतनिक अवकाश मिलना अनिवार्य है।",
        adv3: "3. बैंक भुगतान: नकद भुगतान से बचें। बैंक खाते में पैसे आने से कानूनी सबूत रहता है।"
      }
    };

    function render() {
      const container = document.getElementById("app");
      if (!container) return;

      const lang = state.language;
      const isHi = lang === "hi";
      const tr = t[lang];

      // Clean render
      if (state.activeView === "landing") {
        container.innerHTML = renderLanding(tr);
      } else if (state.activeView === "login") {
        container.innerHTML = renderLogin(tr);
      } else if (state.activeView === "register") {
        container.innerHTML = renderRegister(tr);
      } else {
        // Authenticated Dashboard Layout
        container.innerHTML = `
          <div class="flex h-screen overflow-hidden">
            <!-- Sidebar -->
            ${renderSidebar(tr, isHi)}
            
            <div class="flex flex-1 flex-col overflow-hidden">
              <!-- Top Navbar -->
              ${renderTopNav(tr, isHi)}
              
              <!-- Subview Content -->
              <main class="flex-1 overflow-y-auto p-6 bg-slate-50 dark:bg-slate-950">
                ${renderSubview(tr, isHi)}
              </main>
            </div>
          </div>
          
          <!-- Global SOS Modal -->
          ${state.sosOpen ? renderSosModal(isHi) : ""}
          <!-- Global Diary Log Modal -->
          ${state.diaryModalOpen ? renderDiaryModal(isHi) : ""}
        `;
      }

      // Re-initialize icons dynamically
      lucide.createIcons();
    }

    // --- SUBVIEWS BUILDERS ---

    function renderLanding(tr) {
      return `
        <!-- Navbar -->
        <nav class="sticky top-0 z-50 w-full border-b border-slate-200 dark:border-slate-800 bg-white/70 dark:bg-slate-950/70 backdrop-blur-md">
          <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 flex h-16 items-center justify-between">
            <div class="flex items-center gap-2">
              <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-blue-600 text-white shadow-lg">
                <i data-lucide="shield" class="h-5 w-5"></i>
              </div>
              <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-blue-600 to-green-600 bg-clip-text text-transparent">
                ${tr.logo}
              </span>
            </div>
            <div class="flex items-center gap-4">
              <button onclick="toggleLanguage()" class="rounded-xl border border-slate-200 dark:border-slate-800 px-3 py-1.5 text-xs font-semibold hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                <i data-lucide="languages" class="h-3.5 w-3.5 inline mr-1"></i>${state.language === "en" ? "हिंदी" : "English"}
              </button>
              <button onclick="toggleThemeMode()" class="rounded-xl border border-slate-200 dark:border-slate-800 p-2 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500">
                <i data-lucide="${state.theme === 'dark' ? 'sun' : 'moon'}" class="h-4 w-4"></i>
              </button>
              <button onclick="navigate('login')" class="text-sm font-semibold hover:text-blue-600 transition-colors hidden sm:block">${tr.signIn}</button>
              <button onclick="handleGuestLogin()" class="rounded-xl bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700 shadow-md transition-all">
                ${tr.getStarted}
              </button>
            </div>
          </div>
        </nav>

        <!-- Hero Section -->
        <section class="flex-1 py-16 lg:py-28 relative overflow-hidden flex flex-col justify-center items-center">
          <div class="absolute top-1/4 left-1/2 -z-10 h-96 w-96 -translate-x-1/2 -translate-y-1/2 rounded-full bg-blue-600/5 blur-[100px]"></div>
          <div class="mx-auto max-w-4xl px-6 text-center space-y-6">
            <div class="inline-flex items-center gap-1.5 rounded-full bg-blue-500/10 px-4 py-1.5 text-xs font-semibold text-blue-600">
              <i data-lucide="sparkles" class="h-3.5 w-3.5"></i> Delhi NCT Migrant Workers Welfare Assistant
            </div>
            <h1 class="text-4xl sm:text-5xl md:text-6xl font-extrabold tracking-tight">
              ${tr.tagline}
            </h1>
            <p class="text-sm sm:text-base text-slate-500 max-w-2xl mx-auto leading-relaxed">
              ${tr.subtagline}
            </p>
            <div class="flex flex-col sm:flex-row items-center justify-center gap-4 pt-4">
              <button onclick="handleGuestLogin()" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 rounded-xl bg-blue-600 px-6 py-3.5 text-sm font-semibold text-white hover:bg-blue-700 shadow-lg shadow-blue-500/20 transition-all">
                ${tr.getStarted} (Guest Mode) <i data-lucide="arrow-right" class="h-4 w-4"></i>

                ${m.response ? `
                  <div class="flex items-start gap-3">

            ${state.chatLoading ? `

    // --- RIGHTS LIBRARY SUBVIEW ---

      return `

          <!-- Filters & Search -->

            <div class="flex gap-1.5 overflow-x-auto pb-1 max-w-full no-scrollbar shrink-0">

                <button onclick="state.rightsCategory='${cat}'; render();" class="rounded-xl px-3.5 py-2 text-xs font-semibold border transition-all ${
                  state.rightsCategory === cat

          <!-- Cards Grid -->

              <div class="col-span-full py-20 text-center text-xs text-slate-400">Loading rights index data...</div>

            ${filtered.map(r => `
              <div onclick="state.selectedRight = ${JSON.stringify(r).replace(/"/g, '&quot;')}; render();" class="group cursor-pointer rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 hover:border-blue-600/40 shadow-sm flex flex-col justify-between hover:-translate-y-0.5 transition-all">

                  <div class="h-9 w-9 rounded-xl bg-blue-600/10 text-blue-600 flex items-center justify-center">

                <div class="pt-3 border-t border-slate-100 dark:border-slate-850 mt-4 flex items-center justify-between text-[10px] font-bold text-blue-600">

                      ${r.details_en.rates.map(rate=>`<tr><td class="p-2 font-medium">${rate.skill}</td><td class="p-2 text-blue-600">${rate.daily}</td><td class="p-2 font-bold">${rate.monthly}</td></tr>`).join("")}

                      <tr class="bg-slate-50 dark:bg-slate-950 font-bold border-b border-slate-100 dark:border-slate-850"><th class="p-2">कौशल</th><th class="p-2">दैनिक</th><th class="p-2">मासिक</th></tr>

                        <i data-lucide="sparkles" class="h-4 w-4 animate-pulse"></i> AI Advisor Analysis
                      </h4>
                      <div class="text-[11px] text-slate-750 dark:text-slate-300 leading-relaxed space-y-2">

    // --- COMPLAINTS SUBVIEW ---
    function renderComplaints(tr, isHi) {

            </div>

            <div class="space-y-1">
              <label class="text-[10px] font-bold text-slate-500">Notes (Optional)</label>
              <textarea rows="2" placeholder="e.g. Worked overtime, paid in cash." oninput="state.diaryForm.notes=this.value" class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 px-3 py-2 text-xs focus:outline-none">${form.notes}</textarea>
            </div>

            <div class="flex justify-end gap-3 pt-3 border-t border-slate-100 dark:border-slate-800">
              <button type="button" onclick="state.diaryModalOpen=false; render();" class="rounded-xl border px-4 py-2 text-xs font-semibold hover:bg-slate-100 dark:hover:bg-slate-900">Cancel</button>
              <button type="submit" class="rounded-xl bg-blue-600 text-white px-5 py-2 text-xs font-semibold hover:bg-blue-700 transition shadow">Save Log</button>
            </div>
          </form>
        </div>
      `;
    }

    // --- PROFILE SUBVIEW ---
    function renderProfile(tr, isHi) {
      const isGuest = state.user?.role === "guest";
      return `
        <div class="space-y-6 max-w-2xl mx-auto">
          <div>
            <h2 class="text-xl font-bold">${isHi ? "प्रोफ़ाइल और सेटिंग्स" : "Profile & Preferences"}</h2>
            <p class="text-xs text-slate-500">Configure theme, dashboard language translations, and update password parameters.</p>
          </div>

          <div class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 flex items-center gap-4 shadow-sm">
            <div class="h-14 w-14 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-600 text-white font-extrabold text-xl flex items-center justify-center shadow-lg shadow-blue-500/20">
              ${state.user?.username.slice(0, 2).toUpperCase() || "G"}
            </div>
            <div>
              <h3 class="font-bold text-sm text-slate-850 dark:text-slate-100">${state.user?.username}</h3>
              <p class="text-[9px] font-semibold text-slate-450 mt-1 uppercase"><span class="rounded-full bg-blue-600/10 text-blue-600 border border-blue-600/20 px-2 py-0.5">${state.user?.role || "Guest"} Account</span></p>
            </div>
          </div>

          <!-- Preferences settings -->
          <div class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 shadow-sm space-y-6">
            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider border-b pb-2">Layout Settings</h4>
            
            <div class="flex items-center justify-between gap-4">
              <div>
                <p class="text-xs font-bold text-slate-800 dark:text-slate-100 flex items-center gap-1.5"><i data-lucide="languages" class="h-4 w-4 text-blue-600"></i> Preferred Language</p>
                <p class="text-[10px] text-slate-400 mt-1">Translate UI fields between Hindi and English.</p>
              </div>
              <div class="flex rounded-xl bg-slate-100 dark:bg-slate-950 p-1 border">
                <button onclick="if(state.language==='hi') toggleLanguage();" class="rounded-lg px-3 py-1.5 text-[11px] font-bold ${state.language==='en'?'bg-white dark:bg-slate-800 shadow-sm text-slate-800 dark:text-slate-100':'text-slate-450'}">English</button>
                <button onclick="if(state.language==='en') toggleLanguage();" class="rounded-lg px-3 py-1.5 text-[11px] font-bold ${state.language==='hi'?'bg-white dark:bg-slate-800 shadow-sm text-slate-800 dark:text-slate-100':'text-slate-450'}">हिंदी</button>
              </div>
            </div>

            <div class="flex items-center justify-between gap-4">
              <div>
                <p class="text-xs font-bold text-slate-800 dark:text-slate-100 flex items-center gap-1.5"><i data-lucide="${state.theme==='dark'?'moon':'sun'}" class="h-4 w-4 text-yellow-500"></i> Theme Mode</p>
                <p class="text-[10px] text-slate-400 mt-1">Swap between Dark and Light mode themes.</p>
              </div>
              <button onclick="toggleThemeMode()" class="rounded-xl border px-3 py-1.5 text-xs font-bold hover:bg-slate-50 dark:hover:bg-slate-850 flex items-center gap-1">
                <i data-lucide="${state.theme==='dark'?'sun':'moon'}" class="h-3.5 w-3.5"></i> Toggle Theme
              </button>
            </div>
          </div>

          <!-- registered password change -->
          ${isGuest ? `
            <div class="rounded-2xl bg-amber-500/10 border border-amber-500/20 p-4 text-xs text-amber-600 leading-normal flex gap-2">
              <i data-lucide="info" class="h-5 w-5 shrink-0 mt-0.5"></i>
              <div>
                <p class="font-bold">Guest Mode Warning</p>
                <p class="mt-1">You are currently logged in as guest. Please log out and register a new account to configure custom passwords and protect your logs permanently.</p>
              </div>
            </div>
          ` : `
            <form onsubmit="event.preventDefault(); alert('Password updated successfully!');" class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 shadow-sm space-y-4">
              <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider border-b pb-2">Change Password</h4>
              <div class="space-y-1">
                <label class="text-[10px] font-bold text-slate-500">New Password</label>
                <input type="password" required class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 px-3 py-2 text-xs focus:outline-none">
              </div>
              <button type="submit" class="rounded-xl bg-blue-600 text-white px-4 py-2 text-xs font-bold hover:bg-blue-700 transition">Update Password</button>
            </form>
          `}

          <!-- Terminate session -->
          <div class="rounded-2xl border border-rose-500/20 bg-rose-500/5 p-5 flex items-center justify-between shadow-sm">
            <div>
              <p class="text-xs font-bold text-rose-500">Logout Session</p>
              <p class="text-[10px] text-slate-400 mt-1">Safely exit your workspace and remove local tokens.</p>
            </div>
            <button onclick="logout()" class="rounded-xl bg-rose-500 hover:bg-rose-600 text-white px-4 py-2.5 text-xs font-bold flex items-center gap-1 shadow-sm"><i data-lucide="log-out" class="h-4 w-4"></i> Log Out</button>
          </div>
        </div>
      `;
    }

    // --- SOS MODAL ---
    function renderSosModal(isHi) {
      return `
        <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm px-4">
          <div class="w-full max-w-sm rounded-3xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-6 shadow-2xl space-y-5 animate-scale-in">
            <div class="flex justify-between items-center border-b pb-3">
              <div class="flex items-center gap-1.5 text-rose-500">
                <i data-lucide="alert-triangle" class="h-5 w-5"></i>
                <h3 class="text-sm font-bold">${isHi ? "आपातकालीन संपर्क सूची" : "Emergency Contact Helpline"}</h3>
              </div>
              <button onclick="state.sosOpen = false; render();" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="h-4.5 w-4.5"></i></button>
            </div>
            <p class="text-[10px] text-slate-400 leading-normal">If you are facing physical harassment, containment, or severe injury, call immediately:</p>
            <div class="space-y-2">
              <a href="tel:112" class="flex justify-between items-center bg-slate-50 dark:bg-slate-950 p-2.5 rounded-xl border hover:border-rose-500/40 hover:bg-rose-500/5 transition text-xs font-semibold">
                <span>Police / PCR (पुलिस)</span>
                <span class="rounded bg-rose-500 text-white px-2.5 py-1 font-bold">112</span>
              </a>
              <a href="tel:155214" class="flex justify-between items-center bg-slate-50 dark:bg-slate-950 p-2.5 rounded-xl border hover:border-rose-500/40 hover:bg-rose-500/5 transition text-xs font-semibold">
                <span>Delhi Labour Helpline (श्रम हेल्पलाइन)</span>
                <span class="rounded bg-blue-600 text-white px-2.5 py-1 font-bold">155214</span>
              </a>
              <a href="tel:14434" class="flex justify-between items-center bg-slate-50 dark:bg-slate-950 p-2.5 rounded-xl border hover:border-rose-500/40 hover:bg-rose-500/5 transition text-xs font-semibold">
                <span>National Labour Helpline (राष्ट्रीय श्रम)</span>
                <span class="rounded bg-blue-600 text-white px-2.5 py-1 font-bold">14434</span>
              </a>
            </div>
            <button onclick="state.sosOpen=false; render();" class="w-full py-2.5 text-xs border rounded-xl bg-slate-50 hover:bg-slate-100 font-semibold transition">Close SOS</button>
          </div>
        </div>
      `;
    }

    // --- INITIAL BOOTSTRAP ---
    async function initApp() {
      await refreshUser();
      if (state.token) {
        state.activeView = "dashboard";
      } else {
        state.activeView = "landing";
      }
      render();
    }
    initApp();
  </script>
</body>
</html>
